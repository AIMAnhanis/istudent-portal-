<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i-Student | Login Portal</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body id="vanta-bg" class="d-flex align-items-center justify-content-center vh-100">

    <div class="container position-relative" style="z-index: 1;">
        <div class="row justify-content-center">
            <div class="col-md-5 col-sm-8 col-11">
                
                <div class="card glass-card bg-transparent shadow-lg">
                    <div class="card-body p-5 text-center">
                        
                        <div class="mb-4">
                            <h3 class="fw-bold text-white">i-Student</h3>
                            <p class="text-white-50">Student Management System</p>
                        </div>

                        <form class="text-start">
                            <div class="mb-3">
                                <label for="studentId" class="form-label fw-semibold text-white">Student Name</label>
                                <input type="text" class="form-control glass-input" id="studentId" placeholder="AIMAN" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-white">Password</label>
                                <input type="password" class="form-control glass-input" id="password" placeholder="1234" required>
                            </div>
                            <a href="dashboard.html" class="btn btn-primary w-100 fw-bold">Login</a>
                        </form>
                        
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.halo.min.js"></script>
    <script>
        VANTA.HALO({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00
        })
    </script>

</body>
</html>
